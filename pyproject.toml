[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asm2cpp"
version = "0.1.0"
description = "Assembly and binary to C++ decompiler using LLM refinement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aaron Sharif"}
]
keywords = ["decompiler", "assembly", "c++", "llm", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Disassemblers",
]

dependencies = [
    "anthropic>=0.18.0",
    "tree-sitter>=0.21.0; python_version < '3.12'",
    "tree-sitter-languages>=1.10.0; python_version < '3.12'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
asm2cpp = "asm2cpp.cli:main"

[project.urls]
Homepage = "https://github.com/Sharif262/asm2cpp"
Repository = "https://github.com/Sharif262/asm2cpp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
